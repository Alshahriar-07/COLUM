# COLUM Beta 1 - Main Configuration
# This file is loaded on startup and can be overridden by environment variables

assistant:
  name: "COLUM"
  wake_word: "COLUM"
  inactivity_timeout_minutes: 5

openrouter:
  api_key: "${OPENROUTER_API_KEY}"
  mode: "free"
  model_selection: "dynamic"
  fallback_enabled: true
  timeout_seconds: 60
  max_retries: 3
  # Specific model when mode is "specific"
  specific_model: ""

voice:
  stt_provider: "${VOICE_STT_PROVIDER:-whisper_local}"
  tts_provider: "${VOICE_TTS_PROVIDER:-edge}"
  push_to_talk_enabled: true
  language: "${VOICE_LANGUAGE:-en-US}"
  sample_rate: 16000
  chunk_duration_ms: 1000
  silence_threshold: 0.01
  max_recording_seconds: 30

vision:
  enabled: true
  capture_mode: "on_demand"
  screenshot_quality: 85
  ocr_enabled: true
  ocr_language: "eng"

security:
  confirmation_mode: "smart"
  allow_file_delete: false
  allow_external_send: false
  allow_admin_commands: false
  # Risk levels: low, medium, high
  # Tools requiring confirmation by default
  high_risk_tools:
    - "file.delete"
    - "file.move"
    - "terminal.run"
    - "web.upload"
    - "message.send"
    - "app.close_unsaved"

memory:
  enabled: true
  store_raw_audio: false
  store_raw_screenshots: false
  max_conversation_history: 50
  max_task_history: 100
  persistence_path: "data/memory"

workspace:
  default: "Coding"
  available:
    - "Coding"
    - "Research"
    - "Gaming"
    - "Communication"
    - "COLUM Admin"

logging:
  level: "${LOG_LEVEL:-INFO}"
  file: "${LOG_FILE:-data/logs/colum.log}"
  max_file_size_mb: 10
  backup_count: 5
  format: "json"
  console_output: true

ui:
  theme: "${UI_THEME:-light}"
  animations_enabled: true
  floating_orb_enabled: true
  dashboard_enabled: true

server:
  host: "${BACKEND_HOST:-127.0.0.1}"
  http_port: ${BACKEND_PORT:-8765}
  ws_port: ${BACKEND_WS_PORT:-8766}
  cors_origins:
    - "http://127.0.0.1:8765"
    - "http://localhost:8765"